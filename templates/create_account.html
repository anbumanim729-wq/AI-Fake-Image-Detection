```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - TruthLens</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/create_account.css') }}"
    >

</head>


<body>


    <!-- Main Register Container -->

    <div class="register-container">


        <!-- Register Card -->

        <div class="register-card">


            <!-- Logo -->

            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">TruthLens</span>
            </div>


            <!-- Heading -->

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Complete your profile to use TruthLens
            </p>


            <!-- Error Message -->

            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <!-- Success Message -->

            {% if success %}

            <div class="success-message">
                {{ success }}
            </div>

            {% endif %}


            <!-- Create Account Form -->

            <form
                action="{{ url_for('create_account') }}"
                method="POST"
                autocomplete="off"
            >


                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email Address -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Phone Number -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your 10-digit phone number"
                        autocomplete="tel"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        title="Please enter a valid 10-digit phone number"
                        required
                    >

                </div>


                <!-- Date of Birth -->

                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Terms and Conditions -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        value="accepted"
                        required
                    >

                    <label for="terms">
                        I agree to the
                        <a href="#" onclick="return false;">
                            Terms &amp; Conditions
                        </a>
                    </label>

                </div>


                <!-- Create Account Button -->

                <button
                    type="submit"
                    class="create-account-btn"
                >
                    🛡️ Create Account
                </button>


                <!-- Login Link -->

                <p class="login-text">

                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                </p>


            </form>


        </div>


    </div>


    <!-- Password Match Validation -->

    <script>

        const form = document.querySelector("form");

        const password = document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirm_password");


        form.addEventListener("submit", function (event) {

            if (password.value !== confirmPassword.value) {

                event.preventDefault();

                alert("Passwords do not match!");

                confirmPassword.focus();

            }

        });

    </script>


</body>

</html>
```
