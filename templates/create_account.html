<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - TruthLens</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/create_account.css') }}">
</head>

<body>

<div class="page-container">

    <div class="register-card">

        <div class="logo">
            🛡️ <span>TruthLens</span>
        </div>

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Complete your profile to use TruthLens
        </p>


        <form action="/create_account" method="POST">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text"
                       name="fullname"
                       placeholder="Enter your full name"
                       required>
            </div>


            <div class="form-group">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       placeholder="anbu321@gmail.com"
                       required>
            </div>


            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel"
                       name="phone"
                       placeholder="Enter your phone number"
                       required>
            </div>


            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date"
                       name="dob"
                       required>
            </div>


            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="••••••••"
                       required>
            </div>


            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password"
                       name="confirm_password"
                       placeholder="Re-enter password"
                       required>
            </div>


            <div class="terms">

                <input type="checkbox"
                       name="terms"
                       required>

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </span>

            </div>


            <button type="submit">
                Create Account
            </button>


            <p class="login-text">
                Already have an account?
                <a href="/login">Login</a>
            </p>


            <p class="signup-text">
                Already signed up?
                <a href="/signup">Sign Up</a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
