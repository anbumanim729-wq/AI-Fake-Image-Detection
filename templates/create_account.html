<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - TruthLens</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/create_account.css') }}">
</head>

<body>

<div class="container">

    <div class="logo">
        🛡️ <span>TruthLens</span>
    </div>

    <h1>Create Your Account</h1>

    <p class="subtitle">
        Complete your profile to use TruthLens
    </p>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="success-message">
            {{ success }}
        </div>
    {% endif %}

    <!-- IMPORTANT: use hyphen -->
    <form action="/create-account" method="POST">

        <label for="fullname">Full Name</label>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="anbu321@gmail.com"
            required
        >

        <label for="phone">Phone Number</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >

        <label for="dob">Date of Birth</label>
        <input
            type="date"
            id="dob"
            name="dob"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="•••••••"
            required
        >

        <label for="confirm_password">Confirm Password</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Re-enter password"
            required
        >

        <div class="terms">

            <input
                type="checkbox"
                id="terms"
                name="terms"
                required
            >

            <label for="terms">
                I agree to the
                <a href="#">Terms & Conditions</a>
            </label>

        </div>

        <button type="submit">
            Create Account
        </button>

        <p class="login-text">
            Already have an account?
            <a href="/">Login</a>
        </p>

        <p class="signup-text">
            Already signed up?
            <a href="/signup">Sign Up</a>
        </p>

    </form>

</div>

</body>
</html>
